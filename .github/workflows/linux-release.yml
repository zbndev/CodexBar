name: Linux Release

# Manual only. This fork does not send pull requests upstream and does not
# release on a schedule; a release happens when a human asks for one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without a leading v (e.g. 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: false

# Only the job that publishes needs write. Everything before it builds,
# packages and verifies with a read-only token.
permissions:
  contents: read

# Two dispatches of one version would race for a single tag, and the loser
# would only find out after paying for a full release build.
concurrency:
  group: linux-release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    # Everything runs inside the checkout, which is deliberately not the
    # default location — see the checkout step in `validate`.
    working-directory: CodexBar

jobs:
  # Fails in seconds on a typo, before two expensive jobs start.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Checked out as "CodexBar", not the repository name. linux/Package.swift
      # declares `.package(path: "..")` and its targets ask for
      # `package: "CodexBar"`, and SwiftPM takes a path dependency's identity
      # from the directory name rather than the manifest's `name:`. Checking
      # out as the repository name (CodexBar-Linux) fails resolution with
      # "unknown package 'CodexBar' in dependencies of target
      # 'CodexBarLinuxKit'". Nothing else builds linux/ in CI, so this only
      # ever surfaces here. Every job checks out the same way so that
      # `working-directory` above holds for all of them.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: CodexBar

      - name: Validate the version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          # checkout fetches no tags, so ask the remote rather than the clone.
          if git ls-remote --exit-code --tags origin "refs/tags/linux-v$version" >/dev/null 2>&1; then
            echo "::error::tag linux-v$version already exists"
            exit 1
          fi

  # Debian 13's glibc 2.41 is exactly the supported floor, so the test host
  # drops no target while providing libadwaita 1.7 instead of Ubuntu 24.04's 1.5.
  # Runs alongside `build` rather than ahead of it: the debug build the tests
  # need and the release build the packages need share nothing, so serializing
  # them only added the shorter of the two to the critical path.
  test:
    needs: validate
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: CodexBar

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            pkg-config libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            libcurl4-openssl-dev librsvg2-common xvfb
          pkg-config --modversion gtk4 libadwaita-1

      - uses: ./CodexBar/.github/actions/setup-swift-linux
        with:
          method: tarball

      - name: Run the tests
        run: xvfb-run -a swift test --package-path linux

  build:
    # Not a supported target — a build host. Its glibc (2.39) is the oldest of
    # any candidate, and glibc is forward- but not backward-compatible, so its
    # output runs on every supported distribution. Building on a newer host
    # produces binaries that die on Debian 13 with "GLIBC_2.43 not found".
    # See linux/packaging/NOTES.md.
    #
    # Only this job needs to be that host. The packagers below read the tree it
    # produces and compile nothing, so where they run does not matter.
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: CodexBar

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libcurl4-openssl-dev

      - uses: ./CodexBar/.github/actions/setup-swift-linux

      - name: Stamp the version
        run: linux/packaging/set-version.sh "${{ inputs.version }}"

      - name: Stage the install tree
        run: linux/packaging/stage.sh "$RUNNER_TEMP/root"

      - name: Smoke-test the staged binary
        run: "$RUNNER_TEMP/root/usr/bin/codexbar --version"

      - name: Pack the staged tree
        shell: bash
        run: |
          set -euo pipefail
          # A tarball, not the tree itself: upload-artifact drops the
          # executable bit and dereferences symlinks, and the staged tree needs
          # both — dpkg refuses a package whose /usr/bin/codexbar arrived as a
          # copy rather than as the relative symlink stage.sh made.
          #
          # This is also a release asset, so the packaging jobs and the release
          # share one file instead of building two.
          mkdir -p "$RUNNER_TEMP/artifacts"
          tar -C "$RUNNER_TEMP/root" -czf \
            "$RUNNER_TEMP/artifacts/codexbar-${{ inputs.version }}-x86_64.tar.gz" usr

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-tree
          path: ${{ runner.temp }}/artifacts/codexbar-${{ inputs.version }}-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          # Already compressed; recompressing costs time and saves nothing.
          compression-level: 0

  # One leg per artifact, each building its package and immediately installing
  # it in the distribution it targets. Build and verify stay in the same leg on
  # purpose: a separate verify job would have to depend on the whole matrix,
  # since a matrix leg cannot depend on another leg, which would put a barrier
  # where there is no dependency.
  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # A broken packager should not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - id: deb
            apt: dpkg-dev
            script: make-deb.sh
            image: debian:13
            verify: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /pkg/codexbar_*_amd64.deb >/dev/null
              codexbar --version
          - id: rpm
            apt: rpm
            script: make-rpm.sh
            image: fedora:42
            verify: |
              dnf install -y -q /pkg/codexbar-*.x86_64.rpm >/dev/null
              codexbar --version
          - id: appimage
            apt: file desktop-file-utils zsync
            script: make-appimage.sh
            image: debian:13
            verify: |
              # A thin bundle by design, so gtk4 and webkitgtk come from the
              # host — see linux/packaging/NOTES.md for why bundling WebKit
              # cannot work.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq libgtk-4-1 libwebkitgtk-6.0-4 libsqlite3-0 >/dev/null
              /pkg/CodexBar-*.AppImage --appimage-extract-and-run --version
          # Arch has no hosted runner and could not build this anyway — its
          # glibc is newer than every supported target. The container only
          # packages the tree the build job already produced. Installing it is
          # also the proof that a binary built against glibc 2.39 runs on the
          # newest glibc any target ships, which is the whole reason the build
          # host is the oldest candidate rather than the newest.
          - id: arch
            apt: ""
            script: make-arch.sh
            image: archlinux:base
            verify: |
              pacman -Sy --noconfirm >/dev/null
              pacman -U --noconfirm /pkg/codexbar-linux-*.pkg.tar.zst >/dev/null
              codexbar --version
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: CodexBar

      # No Swift and no gtk headers here: the packagers read a finished tree.
      - name: Install packaging dependencies
        if: matrix.apt != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-tree
          path: ${{ runner.temp }}/staged

      - name: Unpack the staged tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/root"
          tar -C "$RUNNER_TEMP/root" -xzf "$RUNNER_TEMP/staged"/codexbar-*.tar.gz

      - name: Build the ${{ matrix.id }} package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          "linux/packaging/${{ matrix.script }}" \
            "$RUNNER_TEMP/root" "${{ inputs.version }}" "$RUNNER_TEMP/artifacts"

      - name: Verify it installs and runs on ${{ matrix.image }}
        shell: bash
        env:
          # Through a file rather than inline in the docker command line, so
          # the snippet goes through exactly one round of shell quoting.
          VERIFY: ${{ matrix.verify }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERIFY" > "$RUNNER_TEMP/verify.sh"
          docker run --rm \
            -v "$RUNNER_TEMP/artifacts:/pkg:ro" \
            -v "$RUNNER_TEMP/verify.sh:/verify.sh:ro" \
            "${{ matrix.image }}" bash -euo pipefail /verify.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.id }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: [test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # gh reads the repository from the checkout's remote.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: CodexBar

      # The staged tarball is both the transfer medium between jobs and a
      # release asset, so it lands in the same directory as the packages and is
      # covered by the same checksums.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-tree
          path: ${{ runner.temp }}/artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts

      - name: Checksum everything
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/artifacts"
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="linux-v${{ inputs.version }}"
          # --target creates the tag at the dispatched commit. Without it the
          # tag would land on the default branch, which is upstream's main.
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "CodexBar for Linux ${{ inputs.version }}" \
            --notes "Linux GUI build. Artifacts: .deb (Debian 13+ / Ubuntu 25.10+), .rpm (Fedora 42+), .pkg.tar.zst (Arch), .AppImage." \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            ${{ inputs.draft && '--draft' || '' }} \
            "$RUNNER_TEMP"/artifacts/*
