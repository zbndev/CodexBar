name: Linux Release

# Manual only. This fork does not send pull requests upstream and does not
# release on a schedule; a release happens when a human asks for one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without a leading v (e.g. 0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  SWIFT_VERSION: 6.3.3
  SWIFTLY_VERSION: 1.1.3
  SWIFTLY_SIGNING_FINGERPRINT: E813C892820A6FA13755B268F167DF1ACF9CE069

jobs:
  release:
    # Not a supported target — a build host. Its glibc (2.39) is the oldest of
    # any candidate, and glibc is forward- but not backward-compatible, so its
    # output runs on every supported distribution. Building on a newer host
    # produces binaries that die on Debian 13 with "GLIBC_2.43 not found".
    # See linux/packaging/NOTES.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate the version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          # checkout fetches no tags, so ask the remote rather than the clone.
          if git ls-remote --exit-code --tags origin "refs/tags/linux-v$version" >/dev/null 2>&1; then
            echo "::error::tag linux-v$version already exists"
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libcurl4-openssl-dev \
            dpkg-dev rpm file desktop-file-utils zsync

      - name: Restore Swift toolchain cache
        id: swift-toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/swiftly
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-swiftly-${{ env.SWIFTLY_VERSION }}

      - name: Install Swift ${{ env.SWIFT_VERSION }} via swiftly
        shell: bash
        run: |
          set -euo pipefail

          missing_packages=()
          for package in ca-certificates gpg libcurl4-openssl-dev; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
              missing_packages+=("$package")
            fi
          done
          if [[ "${#missing_packages[@]}" -gt 0 ]]; then
            sudo apt-get update
            sudo apt-get install -y "${missing_packages[@]}"
          fi

          SWIFTLY_ARCH="$(uname -m)"
          SWIFTLY_ARCHIVE="$RUNNER_TEMP/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz"
          SWIFTLY_SIGNATURE="${SWIFTLY_ARCHIVE}.sig"
          SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          SWIFTLY_BIN_DIR="$HOME/.local/bin"
          SWIFT_GNUPGHOME="$(mktemp -d)"
          SWIFT_KEYS="$RUNNER_TEMP/swift-signing-keys.asc"
          POST_INSTALL_SCRIPT="$(mktemp)"

          mkdir -p "$SWIFTLY_BIN_DIR"
          chmod 700 "$SWIFT_GNUPGHOME"
          echo "Swift toolchain cache hit: ${{ steps.swift-toolchain-cache.outputs.cache-hit }}"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz" -o "$SWIFTLY_ARCHIVE"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz.sig" -o "$SWIFTLY_SIGNATURE"
          curl -fsSL --compressed "https://www.swift.org/keys/all-keys.asc" -o "$SWIFT_KEYS"
          GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --import "$SWIFT_KEYS"
          SIGNATURE_STATUS="$(GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --status-fd=1 \
            --verify "$SWIFTLY_SIGNATURE" "$SWIFTLY_ARCHIVE" 2>&1)"
          printf '%s\n' "$SIGNATURE_STATUS"
          grep -Fq "[GNUPG:] VALIDSIG ${SWIFTLY_SIGNING_FINGERPRINT} " <<< "$SIGNATURE_STATUS"
          tar -xzf "$SWIFTLY_ARCHIVE" -C /tmp
          /tmp/swiftly init --assume-yes --skip-install

          . "$SWIFTLY_HOME_DIR/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

          swiftly install "$SWIFT_VERSION" --use --assume-yes --verify --post-install-file "$POST_INSTALL_SCRIPT"
          if [[ -s "$POST_INSTALL_SCRIPT" ]]; then
            sudo apt-get update
            sudo bash "$POST_INSTALL_SCRIPT"
          fi

          hash -r
          swift --version

      - name: Run the tests
        run: swift test --package-path linux

      - name: Stamp the version
        run: linux/packaging/set-version.sh "${{ inputs.version }}"

      - name: Stage the install tree
        run: linux/packaging/stage.sh "$RUNNER_TEMP/root"

      - name: Smoke-test the staged binary
        run: "$RUNNER_TEMP/root/usr/bin/codexbar --version"

      - name: Build the packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          linux/packaging/make-deb.sh "$RUNNER_TEMP/root" "${{ inputs.version }}" "$RUNNER_TEMP/artifacts"
          linux/packaging/make-rpm.sh "$RUNNER_TEMP/root" "${{ inputs.version }}" "$RUNNER_TEMP/artifacts"
          linux/packaging/make-appimage.sh "$RUNNER_TEMP/root" "${{ inputs.version }}" "$RUNNER_TEMP/artifacts"
          tar -C "$RUNNER_TEMP/root" -czf \
            "$RUNNER_TEMP/artifacts/codexbar-${{ inputs.version }}-x86_64.tar.gz" usr

      - name: Verify the deb installs and runs on Debian 13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/artifacts:/pkg:ro" debian:13 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /pkg/codexbar_*_amd64.deb >/dev/null
            codexbar --version'

      - name: Verify the rpm installs and runs on Fedora 42
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/artifacts:/pkg:ro" fedora:42 bash -lc '
            set -euo pipefail
            dnf install -y -q /pkg/codexbar-*.x86_64.rpm >/dev/null
            codexbar --version'

      - name: Verify the AppImage runs on Debian 13
        shell: bash
        run: |
          set -euo pipefail
          # A thin bundle by design, so gtk4 and webkitgtk come from the host —
          # see linux/packaging/NOTES.md for why bundling WebKit cannot work.
          docker run --rm -v "$RUNNER_TEMP/artifacts:/pkg:ro" debian:13 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq libgtk-4-1 libwebkitgtk-6.0-4 libsqlite3-0 >/dev/null
            /pkg/CodexBar-*.AppImage --appimage-extract-and-run --version'

      - name: Fill in the PKGBUILD checksum
        shell: bash
        run: linux/packaging/prepare-pkgbuild.sh "${{ inputs.version }}" "$RUNNER_TEMP/artifacts"

      - name: Checksum everything
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/artifacts"
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="linux-v${{ inputs.version }}"
          # --target creates the tag at the dispatched commit. Without it the
          # tag would land on the default branch, which is upstream's main.
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "CodexBar for Linux ${{ inputs.version }}" \
            --notes "Linux GUI build. Artifacts: .deb (Debian 13+ / Ubuntu 25.10+), .rpm (Fedora 42+), .AppImage, source PKGBUILD." \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            ${{ inputs.draft && '--draft' || '' }} \
            "$RUNNER_TEMP"/artifacts/*
